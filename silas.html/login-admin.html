<!-- @format -->

<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="../silas.css/admin.css" />
  </head>

  <body>
    <div class="container">
      <div class="left">
        <div class="overlay">
          <div class="logo">
            <a href="Loja.html">
              <img src="../img/logotipo.png" alt="Logo" />
            </a>
          </div>

          <p>Painel Administrativo</p>
        </div>
      </div>

      <div class="right">
        <form id="loginForm">
          <h2>Entrar</h2>

          <p>Bem-vindo Administrador</p>

          <div class="inputBox">
            <label>Email</label>

            <input type="email" id="email" placeholder="Digite o email" />
          </div>

          <div class="inputBox">
            <label>Palavra-passe</label>

            <input
              type="password"
              id="password"
              placeholder="Digite a palavra-passe" />
          </div>

          <button>Entrar</button>

          <p id="msg"></p>
        </form>
      </div>
    </div>

    <script src="../silas.Js/admin.js"></script>
  </body>
</html>
