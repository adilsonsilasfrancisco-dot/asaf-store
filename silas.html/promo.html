<!-- @format -->

<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <title>Carrossel Bootstrap</title>

    <style>
      .carousel-item {
        height: 500px;
      }

      .carousel-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    <script src="../silas.Js/auth.js"></script>
<script>
  Auth.exigir();
</script>
  </head>
  <body>
    <div class="container mt-5">
      <div id="meuCarousel" class="carousel slide" data-bs-ride="carousel">
        <!-- Indicadores -->
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#meuCarousel"
            data-bs-slide-to="0"
            class="active"></button>
          <button
            type="button"
            data-bs-target="#meuCarousel"
            data-bs-slide-to="1"></button>
          <button
            type="button"
            data-bs-target="#meuCarousel"
            data-bs-slide-to="2"></button>
          <button
            type="button"
            data-bs-target="#meuCarousel"
            data-bs-slide-to="3"></button>
          <button
            type="button"
            data-bs-target="#meuCarousel"
            data-bs-slide-to="4"></button>
        </div>

        <!-- Imagens -->
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="../img/pexels-mallonymedia-9537432.jpg" alt="Imagem 1" />
          </div>

          <div class="carousel-item">
            <img src="../img/pexels-brandiboy-4398341.jpg" alt="Imagem 2" />
          </div>

          <div class="carousel-item">
            <img
              src="../img/pexels-sameer-khan-471573592-16944904.jpg"
              alt="Imagem 3" />
          </div>

          <div class="carousel-item">
            <img
              src="../img/pexels-grailify-2658558-4252950.jpg"
              alt="Imagem 4" />
          </div>

          <div class="carousel-item">
            <img
              src="../img/pexels-mallonymedia-9537431CARROSSEL.jpg"
              alt="Imagem 5" />
          </div>
        </div>

        <!-- Botão anterior -->
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#meuCarousel"
          data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>

        <!-- Botão próximo -->
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#meuCarousel"
          data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
