<!-- @format -->

<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produto Masculino</title>
    <link rel="stylesheet" href="../silas.css/mmulheres.css" />
    <script src="../silas.Js/auth.js"></script>
<script>
  Auth.exigir();
</script>
  </head>
  <body>
    <div class="product-container">
      <!-- Imagem do Produto -->
      <div class="product-image">
        <img
          src="https://via.placeholder.com/400x500"
          alt="Camisa Masculina"
          id="main-image" />
        <div class="gallery">
          <img
            src="https://via.placeholder.com/100"
            alt="Imagem 1"
            onclick="changeImage(this)" />
          <img
            src="https://via.placeholder.com/100"
            alt="Imagem 2"
            onclick="changeImage(this)" />
          <img
            src="https://via.placeholder.com/100"
            alt="Imagem 3"
            onclick="changeImage(this)" />
        </div>
      </div>

      <!-- Detalhes do Produto -->
      <div class="product-details">
        <h1>Camisa Casual Premium</h1>
        <p class="price">Kz 15.000</p>
        <p class="description">
          Uma peça versátil e confortável para o dia a dia, feita com 100%
          algodão de alta qualidade.
        </p>

        <div class="size-selector">
          <label>Tamanho:</label>
          <select>
            <option>P</option>
            <option>M</option>
            <option>G</option>
            <option>GG</option>
          </select>
        </div>

        <button class="buy-button">Adicionar ao Carrinho</button>
      </div>
    </div>

    <!-- Área de Comentários -->
    <div class="comments-section">
      <h2>Comentários</h2>
      <form id="comment-form">
        <textarea placeholder="Deixe seu comentário..." required></textarea>
        <button type="submit">Enviar</button>
      </form>
      <div class="comments-list">
        <!-- Comentários serão adicionados aqui -->
      </div>
    </div>

    <script>
      function changeImage(img) {
        document.getElementById("main-image").src = img.src;
      }

      document
        .getElementById("comment-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const commentText = this.querySelector("textarea").value;
          const commentsList = document.querySelector(".comments-list");
          const newComment = document.createElement("p");
          newComment.textContent = commentText;
          commentsList.appendChild(newComment);
          this.reset();
        });
    </script>
  </body>
</html>
