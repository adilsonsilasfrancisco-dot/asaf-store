<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUPORTE</title>
    <link rel="stylesheet" href="../silas.css/CONTATO.CSS" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
      <script src="../silas.Js/auth.js"></script>
<script>
  Auth.exigir();
</script>
  </head>
  <body>
    <section id="contato">
      <h2>Contato e Suporte</h2>
      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required />

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required />

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4" required></textarea>

        <button type="submit">Enviar</button>
      </form>
      <p>Você também pode nos contatar pelo e-mail: ASAFmoda@gmail.com</p>
    </section>
  </body>
</html>
